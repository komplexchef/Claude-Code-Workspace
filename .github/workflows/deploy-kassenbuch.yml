name: Deploy Kassenbuch App

on:
  push:
    branches: [claude/mobile-cash-book-app-ctkptz, main]
    paths: ['kassenbuch-app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kassenbuch-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kassenbuch-app

      - name: Build
        run: npm run build
        working-directory: kassenbuch-app

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kassenbuch-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
